			</ul>

	<main class="form-page">
        <div class="login-card">
            <h2>ĐĂNG KÝ</h2>
            <form action="" method="POST">
                <div class="form-group">
                    <label for="reg-username">Tên tài khoản <span class="required">*</span></label>
                    <input type="text" id="reg-username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Địa chỉ email <span class="required">*</span></label>
                    <input type="email" id="reg-email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Mật khẩu <span class="required">*</span></label>
                    <input type="password" id="reg-password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Xác nhận mật khẩu <span class="required">*</span></label>
                    <input type="password" id="reg-confirm-password" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn-submit">ĐĂNG KÝ</button>

                <div class="form-footer">
                    <a href="dangnhap.html">Đã có tài khoản? Đăng nhập ngay</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>Sản phẩm của nhóm 8 CT18805</p>
