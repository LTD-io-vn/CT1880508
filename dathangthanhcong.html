<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt hàng thành công</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /*  HỘP THÔNG BÁO ĐẶT HÀNG THÀNH CÔN */

        .success-box {
            max-width: 700px;
            margin: 40px auto 80px;
            padding: 60px;
            text-align: center;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        }

        .success-box i {
            font-size: 70px;
            color: #2ecc71;
        }

        .success-box h2 {
            margin: 20px 0;
        }

        .success-box p {
            margin-bottom: 30px;
        }

        .success-box button {
            padding: 15px 40px;
            border: none;
            background: #000;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .success-box button:hover {
            background: #444;
        }


        /*tHANH TIẾN TRÌNH*/

        .cart {
            padding: 40px 0;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 15px;
        }

        .cart-top-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .cart-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 50%;
            height: 2px;
            background: #ddd;
        }

        .cart-top-item {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 50%;
            background: #fff;
            color: #ddd;
        }

        .cart-top-shopping,
        .cart-top-address.active-step,
        .cart-top-payment.active-step {
            border-color: rgb(14, 247, 197);
        }

        .cart-top-shopping i,
        .cart-top-address.active-step i,
        .cart-top-payment.active-step i {
            color: rgb(14, 247, 197);
        }

    </style>

</head>

<body>
    <header>

        <button class="fa-solid fa-bars-staggered" id="nav-toggle"></button>
        <a href="trangchu.html">
            <img src="assets/imgs/logo-dark.png" height="40" alt="Logo">
        </a>
        <nav id="nav-bar">
            <ul>
                <li><a href="trangchu.html"><i class="fa-solid fa-house"></i>Trang chủ</a></li>
                <li><a href="gioithieu.html"><i class="fa-solid fa-circle-info"></i>Giới thiệu</a></li>
                <li><a href="sanpham.html"><i class="fa-solid fa-bag-shopping"></i>Sản phẩm</a></li>
                <li><a href="giohang.html"><i class="fa-solid fa-cart-shopping"></i>Giỏ hàng</a></li>
                <li><a href="dangnhap.html"><i class="fa-solid fa-arrow-right-to-bracket"></i>Đăng nhập</a></li>
                <li><a href="dangky.html"><i class="fa-solid fa-user-plus"></i>Đăng ký</a></li>
                <li><a href="lienhe.html"><i class="fa-solid fa-envelope"></i>Liên hệ</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <!-- Thanh tiến trình -->
        <section class="cart">

            <div class="container">

                <div class="cart-top-wrap">

                    <div class="cart-top">

                        <div class="cart-top-shopping cart-top-item">
                            <i class="fa-solid fa-basket-shopping"></i>
                        </div>

                        <div class="cart-top-address cart-top-item active-step">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>

                        <div class="cart-top-payment cart-top-item active-step">
                            <i class="fa-solid fa-money-check-dollar"></i>
                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!--thành công -->
        <div class="success-box">

            <i class="fa-solid fa-circle-check"></i>

            <h2>Đặt hàng thành công!</h2>

            <p>Cảm ơn bạn đã mua hàng tại Hoài Âm.</p>

            <button onclick="window.location.href='sanpham.html'">
                TIẾP TỤC MUA SẮM
            </button>

        </div>

    </main>
    <footer>
        <p>Sản phẩm của nhóm 8 CT18805</p>
    </footer>

    <script src="script.js"></script>
    <script src="assets/js/main.js"></script>

</body>

</html>
